name: SeaweedFS GAR Upgrade Validation

on:
  pull_request:
    paths:
      - seaweed/**
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Base branch or commit whose SeaweedFS version is the baseline
        required: true
        default: main
        type: string
      pr_number:
        description: PR number used in the temporary GAR image tag
        required: false
        type: string

concurrency:
  group: seaweed-gar-upgrade-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  GAR_IMAGE: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/testkube/seaweed
  DEV_GKE_CLUSTER_NAME: ${{ secrets.DEV_GKE_CLUSTER_NAME }}
  DEV_GKE_LOCATION: ${{ secrets.DEV_GKE_LOCATION }}
  GKE_PROJECT: ${{ secrets.GKE_PROJECT }}

jobs:
  build-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    environment: dev
    outputs:
      baseline: ${{ steps.versions.outputs.baseline }}
      candidate: ${{ steps.versions.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve baseline and candidate tags
        id: versions
        run: |
          BASE_REF="${{ github.event.pull_request.base.sha || inputs.baseline_ref || github.sha }}"
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          BASELINE_TAG="$(git show "$BASE_REF:seaweed/helm/Chart.yaml" | awk -F'"' '/^appVersion:/ { print $2; exit }')"
          CANDIDATE_VERSION="$(awk -F'"' '/^appVersion:/ { print $2; exit }' seaweed/helm/Chart.yaml)"
          test -n "$BASELINE_TAG"
          test -n "$CANDIDATE_VERSION"
          CANDIDATE_TAG="${CANDIDATE_VERSION}-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}-${CANDIDATE_SHA::7}"
          echo "baseline=$BASELINE_TAG" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice title=SeaweedFS versions::Baseline: $BASELINE_TAG; candidate: $CANDIDATE_TAG"

      - name: GAR login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GKE_SA_KEY_PROD }}

      - name: Build and publish immutable candidate image to GAR
        uses: docker/build-push-action@v6
        with:
          context: seaweed
          file: seaweed/seaweedfs-release.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GAR_IMAGE }}:${{ steps.versions.outputs.candidate }}

  validate-enterprise:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: dev
    env:
      BASELINE_TAG: ${{ needs.build-candidate.outputs.baseline }}
      CANDIDATE_TAG: ${{ needs.build-candidate.outputs.candidate }}
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
      SEAWEED_RELEASE: testkube-seaweed
      SEAWEED_CHART: seaweed/helm
      TEST_WORKFLOW_NAME: postman-workflow-smoke-junit
      ARTIFACT_NAME: artifacts/junit-report.xml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Authenticate to dev GKE using Federated Identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GKE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GKE_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure dev GKE access
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.DEV_GKE_CLUSTER_NAME }}
          location: ${{ secrets.DEV_GKE_LOCATION }}
          project_id: ${{ secrets.GKE_PROJECT }}

      - name: Install Testkube CLI and Expect
        run: |
          VERSION="$(curl -fsSL https://api.github.com/repos/kubeshop/testkube/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/kubeshop/testkube/releases/download/${VERSION}/testkube_${VERSION#v}_Linux_x86_64.tar.gz" | tar -xz
          sudo install kubectl-testkube /usr/local/bin/testkube
          sudo apt-get update
          sudo apt-get install -y expect
          testkube disable telemetry

      - name: Install Enterprise with baseline SeaweedFS
        run: |
          set -euo pipefail
          TARGET_NAMESPACE="enterprise-seaweed-upgrade-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}-${GITHUB_RUN_ATTEMPT}"
          echo "TARGET_NAMESPACE=$TARGET_NAMESPACE" >> "$GITHUB_ENV"
          kubectl create namespace "$TARGET_NAMESPACE"

          registry='${{ secrets.GAR_LOCATION }}-docker.pkg.dev'
          repository='${{ secrets.GCP_PROJECT_ID_PROD }}/testkube/seaweed'
          seaweed_endpoint="$SEAWEED_RELEASE-filer.$TARGET_NAMESPACE.svc.cluster.local:8333"
          echo "SEAWEED_ENDPOINT=$seaweed_endpoint" >> "$GITHUB_ENV"

          # --- Deploy SeaweedFS independently so only this release is upgraded later ---
          helm upgrade --install "$SEAWEED_RELEASE" "$SEAWEED_CHART" \
            --namespace "$TARGET_NAMESPACE" \
            --set image.registry="$registry" \
            --set image.repository="$repository" \
            --set image.tag="$BASELINE_TAG" \
            --set global.seaweedfs.imagePullPolicy=IfNotPresent \
            --set global.seaweedfs.createClusterRole=false \
            --set master.volumeSizeLimitMB=50 \
            --set master.data.type=persistentVolumeClaim \
            --set master.data.size=1Gi \
            --set master.data.storageClass=standard-rwo \
            --set master.logs.type=emptyDir \
            --set 'volume.dataDirs[0].name=data1' \
            --set 'volume.dataDirs[0].type=persistentVolumeClaim' \
            --set 'volume.dataDirs[0].size=1Gi' \
            --set 'volume.dataDirs[0].storageClass=standard-rwo' \
            --set 'volume.dataDirs[0].maxVolumes=0' \
            --set volume.logs.type=emptyDir \
            --set filer.data.type=persistentVolumeClaim \
            --set filer.data.size=1Gi \
            --set filer.data.storageClass=standard-rwo \
            --set filer.logs.type=emptyDir \
            --set filer.s3.enabled=true \
            --set filer.s3.enableAuth=true \
            --set s3.credentials.admin.accessKey=testkube-enterprise \
            --set s3.credentials.admin.secretKey=t3stkub3-3nt3rpr1s3 \
            --wait --timeout=15m

          # --- Install Enterprise without embedded storage and use the external SeaweedFS S3 API ---
          export TESTKUBE_INIT_COMMAND="testkube init demo \
            --namespace $TARGET_NAMESPACE \
            --no-confirm \
            --license $LICENSE_KEY \
            --helm-arg wait= \
            --helm-arg timeout=15m \
            --helm-set dex.rbac.createClusterScoped=false \
            --helm-set minio.enabled=false \
            --helm-set seaweedfs.enabled=false \
            --helm-set global.storage.endpoint=$seaweed_endpoint \
            --helm-set global.storage.secure=false \
            --helm-set global.storage.credsSecretRef= \
            --helm-set global.storage.accessKeyId=testkube-enterprise \
            --helm-set global.storage.secretAccessKey=t3stkub3-3nt3rpr1s3 \
            --helm-set testkube-cloud-api.api.minio.signing.hostname=$seaweed_endpoint \
            --helm-set testkube-cloud-api.api.minio.signing.secure=false \
            --verbose"

          expect -c '
            set timeout 300
            spawn {*}$env(TESTKUBE_INIT_COMMAND)
            expect "Do you want to continue?"
            send "y"
            expect "Do you want to open the dashboard?"
            send "n"
            expect eof
            lassign [wait] pid spawnid os_error_flag exit_status
            exit $exit_status
          '

          # --- Wait for the services used by the validation step to be ready ---
          kubectl -n "$TARGET_NAMESPACE" rollout status deployment/testkube-enterprise-api --timeout=15m
          kubectl -n "$TARGET_NAMESPACE" rollout status deployment/testkube-enterprise-dex --timeout=15m

      - name: Validate artifacts across the Enterprise SeaweedFS upgrade
        run: |
          set -euo pipefail
          port_forward_pids=()

          cleanup() {
            for pid in "${port_forward_pids[@]}"; do
              kill "$pid" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          # --- The Enterprise API and Dex services are internal to the cluster ---
          kubectl -n "$TARGET_NAMESPACE" port-forward svc/testkube-enterprise-api 8088:8088 >/tmp/enterprise-api-port-forward.log 2>&1 &
          port_forward_pids+=("$!")
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8088/health >/dev/null; then
            cat /tmp/enterprise-api-port-forward.log >&2 || true
            exit 1
          fi

          kubectl -n "$TARGET_NAMESPACE" port-forward svc/testkube-enterprise-dex 5556:5556 >/tmp/enterprise-dex-port-forward.log 2>&1 &
          port_forward_pids+=("$!")
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5556/keys >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:5556/keys >/dev/null; then
            cat /tmp/enterprise-dex-port-forward.log >&2 || true
            exit 1
          fi

          # --- Authenticate through Dex before using the Enterprise Testkube API ---
          id_token="$(curl -fsS http://127.0.0.1:5556/token -d grant_type=password -d username=admin@example.com -d password=password -d 'scope=openid email groups offline_access' -d client_id=testkube-enterprise -d client_secret=QWkVzs3nct6HZM5hxsPzwaZtq | jq -er '.id_token')"
          api_token="$(curl -fsS -X POST http://127.0.0.1:8088/organizations/tkcorg_demo/tokens -H "Authorization: Bearer $id_token" -H 'Content-Type: application/json' -d '{"name":"seaweed-upgrade-validation","scopes":[{"resource":"org","identifier":"tkcorg_demo","role":"admin"},{"resource":"env","identifier":"tkcenv_my-first-environment","role":"admin"}]}' | jq -er '.token')"
          testkube set context --namespace "$TARGET_NAMESPACE" --api-uri-override http://127.0.0.1:8088 --api-key "$api_token" --org-id tkcorg_demo --env-id tkcenv_my-first-environment

          # --- Create smoke TestWorkflows through the Testkube API ---
          curl -fsSL https://raw.githubusercontent.com/kubeshop/testkube/main/test/postman/crd-workflow/smoke.yaml -o /tmp/smoke.yaml
          awk 'BEGIN{n=0} /^---$/{n++; next} {print > ("/tmp/tw_" n ".yaml")}' /tmp/smoke.yaml
          for workflow in /tmp/tw_*.yaml; do
            testkube create testworkflow --update -f "$workflow"
          done

          # --- The baseline artifact must be written by the baseline SeaweedFS image ---
          baseline_execution_id="$(testkube --output go --go-template '{{.Id}}' run tw "$TEST_WORKFLOW_NAME" | tr -d '\r\n')"
          testkube watch twe "$baseline_execution_id"
          testkube get artifact "$baseline_execution_id" | grep -F "$ARTIFACT_NAME"

          # --- Upgrade only the external SeaweedFS release, retaining its persistent data ---
          registry='${{ secrets.GAR_LOCATION }}-docker.pkg.dev'
          repository='${{ secrets.GCP_PROJECT_ID_PROD }}/testkube/seaweed'
          helm upgrade "$SEAWEED_RELEASE" "$SEAWEED_CHART" \
            --namespace "$TARGET_NAMESPACE" \
            --reuse-values \
            --set image.registry="$registry" \
            --set image.repository="$repository" \
            --set image.tag="$CANDIDATE_TAG" \
            --wait --timeout=15m

          # Confirm the external storage and Testkube components remain Ready.
          for workload in $(kubectl -n "$TARGET_NAMESPACE" get deployments,statefulsets -o name); do
            kubectl -n "$TARGET_NAMESPACE" rollout status "$workload" --timeout=5m
          done

          # --- Confirm API and worker still use the external SeaweedFS S3 endpoint ---
          curl -fsS http://127.0.0.1:8088/health/readiness >/dev/null
          for deployment in testkube-enterprise-api testkube-enterprise-worker-service; do
            kubectl -n "$TARGET_NAMESPACE" get deployment "$deployment" -o json | \
              jq -e --arg endpoint "$SEAWEED_ENDPOINT" 'any(.spec.template.spec.containers[]?.env[]?; .name == "MINIO_ENDPOINT" and .value == $endpoint)' >/dev/null
            echo "✓ $deployment is Ready and configured for external SeaweedFS"
          done

          # --- The baseline artifact must still be listed after the SeaweedFS upgrade ---
          testkube get artifact "$baseline_execution_id" | grep -F "$ARTIFACT_NAME"

          # --- A new execution proves the upgraded SeaweedFS accepts new artifacts ---
          post_upgrade_execution_id="$(testkube --output go --go-template '{{.Id}}' run tw "$TEST_WORKFLOW_NAME" | tr -d '\r\n')"
          testkube watch twe "$post_upgrade_execution_id"
          testkube get artifact "$post_upgrade_execution_id" | grep -F "$ARTIFACT_NAME"

      - name: Collect Enterprise validation failure diagnostics
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl -n "$TARGET_NAMESPACE" get pods -o wide || true
          echo "::endgroup::"
          echo "::group::Warning events"
          kubectl -n "$TARGET_NAMESPACE" get events --field-selector type=Warning --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::Enterprise API logs"
          kubectl -n "$TARGET_NAMESPACE" logs deployment/testkube-enterprise-api --all-containers --tail=100 || true
          echo "::endgroup::"
          echo "::group::External SeaweedFS resources"
          kubectl -n "$TARGET_NAMESPACE" get deployments,statefulsets,pods,pvc -l app.kubernetes.io/instance="$SEAWEED_RELEASE" -o wide || true
          kubectl -n "$TARGET_NAMESPACE" describe pods -l app.kubernetes.io/instance="$SEAWEED_RELEASE" || true
          echo "::endgroup::"
          echo "::group::External SeaweedFS logs"
          kubectl -n "$TARGET_NAMESPACE" logs -l app.kubernetes.io/instance="$SEAWEED_RELEASE" --all-containers --tail=200 || true
          echo "::endgroup::"

      - name: Remove isolated Enterprise installation
        if: always()
        run: kubectl delete namespace "$TARGET_NAMESPACE" --ignore-not-found --wait=false
