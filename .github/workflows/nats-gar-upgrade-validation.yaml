name: NATS GAR Upgrade Validation

on:
  pull_request:
    paths:
      - nats/**
      - .github/workflows/nats-gar-upgrade-validation.yaml
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Base branch or commit whose NATS version is the baseline
        required: true
        default: main
        type: string
      pr_number:
        description: PR number used in the temporary GAR image tag
        required: false
        type: string

concurrency:
  group: nats-gar-upgrade-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

env:
  GAR_IMAGE: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/testkube/nats

jobs:
  build-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    environment: dev
    outputs:
      baseline: ${{ steps.versions.outputs.baseline }}
      candidate: ${{ steps.versions.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve baseline and candidate tags
        id: versions
        run: |
          # --- Read the baseline from the PR base and the candidate from the PR checkout. ---
          BASE_REF="${{ github.event.pull_request.base.sha || inputs.baseline_ref || github.sha }}"
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          BASELINE_TAG="$(git show "$BASE_REF:nats/helm/Chart.yaml" | awk -F'"' '/^appVersion:/ { print $2; exit }')"
          CANDIDATE_VERSION="$(awk -F'"' '/^appVersion:/ { print $2; exit }' nats/helm/Chart.yaml)"
          test -n "$BASELINE_TAG"
          test -n "$CANDIDATE_VERSION"
          CANDIDATE_TAG="${CANDIDATE_VERSION}-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}-${CANDIDATE_SHA::7}"
          echo "baseline=$BASELINE_TAG" >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice title=NATS versions::Baseline: $BASELINE_TAG; candidate: $CANDIDATE_TAG"

      - name: GAR login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GKE_SA_KEY_PROD }}

      - name: Build and publish immutable candidate image to GAR
        uses: docker/build-push-action@v6
        with:
          context: nats
          file: nats/nats-release.dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.GAR_IMAGE }}:${{ steps.versions.outputs.candidate }}

  validate-enterprise:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: dev
    env:
      BASELINE_TAG: ${{ needs.build-candidate.outputs.baseline }}
      CANDIDATE_TAG: ${{ needs.build-candidate.outputs.candidate }}
      LICENSE_KEY: ${{ secrets.LICENSE_KEY }}
      TEST_WORKFLOW_NAME: postman-workflow-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Authenticate to dev GKE using Federated Identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.GKE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GKE_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure dev GKE access
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.DEV_GKE_CLUSTER_NAME }}
          location: ${{ secrets.DEV_GKE_LOCATION }}
          project_id: ${{ secrets.GKE_PROJECT }}

      - name: Install Testkube CLI and Expect
        run: |
          VERSION="$(curl -fsSL https://api.github.com/repos/kubeshop/testkube/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/kubeshop/testkube/releases/download/${VERSION}/testkube_${VERSION#v}_Linux_x86_64.tar.gz" | tar -xz
          sudo install kubectl-testkube /usr/local/bin/testkube
          sudo apt-get update
          sudo apt-get install -y expect
          testkube disable telemetry

      - name: Install Enterprise with baseline NATS
        run: |
          set -euo pipefail
          TARGET_NAMESPACE="enterprise-nats-upgrade-pr-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}-${GITHUB_RUN_ATTEMPT}"
          echo "TARGET_NAMESPACE=$TARGET_NAMESPACE" >> "$GITHUB_ENV"
          kubectl create namespace "$TARGET_NAMESPACE"

          registry='${{ secrets.GAR_LOCATION }}-docker.pkg.dev'
          repository='${{ secrets.GCP_PROJECT_ID_PROD }}/testkube/nats'
          # --- NATS is bundled with the Enterprise chart, so this installs the complete baseline release. ---
          # --- The candidate upgrade below repeats this command with only the NATS image tag changed. ---
          export TESTKUBE_INIT_COMMAND="testkube init demo --namespace $TARGET_NAMESPACE --no-confirm --license $LICENSE_KEY --helm-arg wait= --helm-arg timeout=15m --helm-set nats.container.image.registry=$registry --helm-set nats.container.image.repository=$repository --helm-set nats.container.image.tag=$BASELINE_TAG --helm-set dex.rbac.createClusterScoped=false --helm-set testkube-ai-service.enabled=false --verbose"

          expect -c '
            set timeout 300
            spawn {*}$env(TESTKUBE_INIT_COMMAND)
            expect "Do you want to continue?"
            send "y"
            expect "Do you want to open the dashboard?"
            send "n"
            expect eof
            lassign [wait] pid spawnid os_error_flag exit_status
            exit $exit_status
          '

          # --- Wait for the Enterprise API and its bundled NATS StatefulSet to accept work. ---
          kubectl -n "$TARGET_NAMESPACE" rollout status statefulset/testkube-enterprise-nats --timeout=15m
          kubectl -n "$TARGET_NAMESPACE" rollout status deployment/testkube-enterprise-api --timeout=15m

      - name: Validate TestWorkflow data across the Enterprise NATS upgrade
        run: |
          set -euo pipefail
          port_forward_pids=()
          cleanup() {
            for pid in "${port_forward_pids[@]}"; do
              kill "$pid" >/dev/null 2>&1 || true
              wait "$pid" 2>/dev/null || true
            done
          }
          trap cleanup EXIT

          start_port_forward() {
            local service="$1" port="$2" endpoint="$3" log_file="$4"
            kubectl -n "$TARGET_NAMESPACE" port-forward "$service" "$port:$port" >"$log_file" 2>&1 &
            port_forward_pids+=("$!")
            for attempt in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port$endpoint" >/dev/null 2>&1 && return 0
              sleep 1
            done
            cat "$log_file" >&2 || true
            curl -fsS "http://127.0.0.1:$port$endpoint" >/dev/null
          }

          # --- The API and Dex services are ClusterIP-only, so expose them temporarily on the runner. ---
          echo "::group::Enterprise API and Dex connectivity"
          start_port_forward svc/testkube-enterprise-api 8088 /health /tmp/enterprise-api-port-forward.log
          start_port_forward svc/testkube-enterprise-dex 5556 /keys /tmp/enterprise-dex-port-forward.log
          id_token="$(curl -fsS http://127.0.0.1:5556/token -d grant_type=password -d username=admin@example.com -d password=password -d 'scope=openid email groups offline_access' -d client_id=testkube-enterprise -d client_secret=QWkVzs3nct6HZM5hxsPzwaZtq | jq -er '.id_token')"
          api_token="$(curl -fsS -X POST http://127.0.0.1:8088/organizations/tkcorg_demo/tokens -H "Authorization: Bearer $id_token" -H 'Content-Type: application/json' -d '{"name":"nats-upgrade-validation","scopes":[{"resource":"org","identifier":"tkcorg_demo","role":"admin"},{"resource":"env","identifier":"tkcenv_my-first-environment","role":"admin"}]}' | jq -er '.token')"
          testkube set context --namespace "$TARGET_NAMESPACE" --api-uri-override http://127.0.0.1:8088 --api-key "$api_token" --org-id tkcorg_demo --env-id tkcenv_my-first-environment
          echo "::endgroup::"

          # --- Create the smoke TestWorkflow through the Enterprise API. ---
          echo "::group::Create smoke TestWorkflow"
          curl -fsSL https://raw.githubusercontent.com/kubeshop/testkube/main/test/postman/crd-workflow/smoke.yaml -o /tmp/smoke.yaml
          awk 'BEGIN{n=0} /^---$/{n++; next} {print > ("/tmp/tw_" n ".yaml")}' /tmp/smoke.yaml
          for workflow in /tmp/tw_*.yaml; do testkube create testworkflow --update -f "$workflow"; done
          echo "::endgroup::"

          # --- Record a baseline execution before the bundled NATS image is replaced. ---
          echo "::group::Baseline TestWorkflow execution"
          baseline_execution_id="$(testkube --output go --go-template '{{.Id}}' run tw "$TEST_WORKFLOW_NAME" | tr -d '\r\n')"
          testkube watch twe "$baseline_execution_id"
          echo "::notice title=Baseline execution passed::Execution ID: $baseline_execution_id"
          echo "::endgroup::"

          # --- Upgrade the same Enterprise release; only its bundled NATS image changes. ---
          echo "::group::Enterprise NATS candidate upgrade"
          registry='${{ secrets.GAR_LOCATION }}-docker.pkg.dev'
          repository='${{ secrets.GCP_PROJECT_ID_PROD }}/testkube/nats'
          export TESTKUBE_INIT_COMMAND="testkube init demo --namespace $TARGET_NAMESPACE --no-confirm --license $LICENSE_KEY --helm-arg wait= --helm-arg timeout=15m --helm-set nats.container.image.registry=$registry --helm-set nats.container.image.repository=$repository --helm-set nats.container.image.tag=$CANDIDATE_TAG --helm-set dex.rbac.createClusterScoped=false --helm-set testkube-ai-service.enabled=false --verbose"
          expect -c '
            set timeout 300
            spawn {*}$env(TESTKUBE_INIT_COMMAND)
            expect "Do you want to continue?"
            send "y"
            expect "Do you want to open the dashboard?"
            send "n"
            expect eof
            lassign [wait] pid spawnid os_error_flag exit_status
            exit $exit_status
          '
          echo "::endgroup::"

          # --- Check that all Enterprise components reconnect after the NATS StatefulSet rolls. ---
          echo "::group::Enterprise readiness after NATS upgrade"
          kubectl -n "$TARGET_NAMESPACE" rollout status statefulset/testkube-enterprise-nats --timeout=15m
          for workload in $(kubectl -n "$TARGET_NAMESPACE" get deployments,statefulsets -o name); do
            kubectl -n "$TARGET_NAMESPACE" rollout status "$workload" --timeout=5m
          done
          curl -fsS http://127.0.0.1:8088/health/readiness >/dev/null
          echo "::endgroup::"

          # --- The workflow and its baseline execution must remain visible after the bundled NATS upgrade. ---
          echo "::group::NATS persistence checks"
          testkube --output go --go-template '{{.Name}}' get tw "$TEST_WORKFLOW_NAME" | grep -Fx "$TEST_WORKFLOW_NAME"
          IFS=, read -r persisted_id persisted_status <<< "$(testkube --output go --go-template '{{.Id}},{{.Result.Status}}' get twe "$baseline_execution_id" | tr -d '\r\n')"
          test "$persisted_id" = "$baseline_execution_id"
          test "$persisted_status" = passed
          echo "::notice title=NATS persistence passed::Baseline execution is still passed"
          echo "::endgroup::"

          # --- A second execution proves Enterprise reconnects to the candidate NATS image. ---
          echo "::group::Post-upgrade TestWorkflow execution"
          post_upgrade_execution_id="$(testkube --output go --go-template '{{.Id}}' run tw "$TEST_WORKFLOW_NAME" | tr -d '\r\n')"
          testkube watch twe "$post_upgrade_execution_id"
          echo "::notice title=Post-upgrade execution passed::Execution ID: $post_upgrade_execution_id"
          echo "::endgroup::"

      - name: Collect Enterprise validation failure diagnostics
        if: failure()
        run: |
          echo "::group::Pods"
          kubectl -n "$TARGET_NAMESPACE" get pods -o wide || true
          echo "::endgroup::"
          echo "::group::Warning events"
          kubectl -n "$TARGET_NAMESPACE" get events --field-selector type=Warning --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::NATS logs"
          kubectl -n "$TARGET_NAMESPACE" logs statefulset/testkube-enterprise-nats --all-containers --tail=100 || true
          echo "::endgroup::"
          echo "::group::Enterprise API logs"
          kubectl -n "$TARGET_NAMESPACE" logs deployment/testkube-enterprise-api --all-containers --tail=100 || true
          echo "::endgroup::"

      - name: Remove isolated Enterprise installation
        if: always()
        run: kubectl delete namespace "$TARGET_NAMESPACE" --ignore-not-found --wait=false
