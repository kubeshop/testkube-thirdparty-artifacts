name: Sync Image to GAR

# Copies an image that is already published on Docker Hub to GAR without
# rebuilding it (same digest), then signs it in both registries. Used to
# backfill versions released before build-images.yaml pushed to GAR and signed.
# Existing GAR tags are never overwritten.
on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to sync'
        required: true
        type: choice
        options:
          - minio
          - mongodb
          - postgresql
          - kubectl
          - seaweed
          - dex
          - nats
      version:
        description: 'Image tag published on Docker Hub (e.g. 8.3.11)'
        required: true
        type: string

concurrency: ${{ github.workflow }}-${{ inputs.service }}-${{ inputs.version }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: DockerHub login (kubeshop)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: GAR login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GKE_SA_KEY_PROD }}

      - name: Push image to GAR
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/push-to-gar.sh "$SERVICE" "$VERSION"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: ./scripts/sign-image.sh "$SERVICE" "$VERSION"
